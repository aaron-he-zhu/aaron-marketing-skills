name: Pi agent PoC (isolated)

# The historical Node probe is retired. Preserve this check identity until the
# repository owner can verify that branch protection does not require `probe`.
# It now exercises the retained local compatibility and guard boundaries.
# No paths filter: the old filter only matched the retired evals/pi-agent-poc
# tree, and this ~10s job must report on every PR in case `probe` is required.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Retained compatibility and dependency-boundary regressions
        run: python3 -m unittest tests.test_v3_compatibility tests.test_markdown_guard_exclusions
